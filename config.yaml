# Plot Configuration
# ------------------

# Plot display options
show_endpoint_values: true  # Show/hide numbers at end of lines

# Colors per language (hex format)
# Languages without a color will get auto-assigned colors
colors:
  bn: "#FF6B6B"   # coral red
  es: "#00FF7F"   # green
  fr: "#3B82F6"   # blue
  ja: "#F59E0B"   # amber
  ko: "#38BDF8"   # sky blue
  pl: "#A3E635"   # lime
  pt: "#A855F7"   # purple
  ro: "#EC4899"   # pink
  uk: "#14B8A6"   # teal
  zh: "#EF4444"   # red
  total: "#CCCCCC"  # neutral gray (for total merged PRs)


# Colors per translation drift status (hex format). They mean good to bad, so
# they come from a fixed status scale and never reuse a language color
status_colors:
  current: "#0CA30C"      # good
  drifted: "#FAB219"      # warning
  unpinned: "#8A8A85"     # neutral gray, no pin to compare with
  orphan: "#EC835A"       # serious, the English page is gone
  invalid_pin: "#D03B3B"  # critical, the pin is not a known commit
